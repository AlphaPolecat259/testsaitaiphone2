<style>

</style></head><body><canvas id="sky" aria-label="Интерактивное звёздное поле"></canvas><div class="grain"></div><div class="vignette"></div>
<script>
(()=>{const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d',{alpha:false});let w=0,h=0,dpr=1,stars=[],bursts=[],lastAuto=0,nextAuto=6800;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.round(w*h/5100)},()=>({x:Math.random()*w,y:Math.random()*h,r:rand(.35,1.35),p:rand(0,7),s:rand(.001,.006),c:Math.random()}))}function burst(x,y,manual=false){bursts.push({x,y,t:0,d:manual?2200:3000,r:rand(90,160),hue:manual?rand(185,315):rand(195,315)});if(bursts.length>6)bursts.shift()}function glow(x,y,r,color,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${color},100%,78%,${a})`);g.addColorStop(.12,`hsla(${color},100%,65%,${a*.62})`);g.addColorStop(.36,`hsla(${color},100%,55%,${a*.18})`);g.addColorStop(1,`hsla(${color},100%,50%,0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}function draw(now){ctx.fillStyle='#000000';ctx.fillRect(0,0,w,h);const drift=reduce?0:Math.sin(now*.00009)*.025;glow(w*(.25+drift),h*.31,Math.max(w,h)*.29,267,.052);glow(w*.78,h*(.69-drift),Math.max(w,h)*.27,192,.043);glow(w*.53,h*.53,Math.max(w,h)*.17,321,.018);for(const s of stars){const tw=reduce ? .78 : .68+.32*Math.sin(now*s.s+s.p),hue=s.c>.83?210:s.c>.66?272:0;ctx.beginPath();ctx.fillStyle=hue?`hsla(${hue},75%,88%,${tw*.78})`:`rgba(244,242,255,${tw*.8})`;ctx.arc(s.x,s.y,s.r*(.86+tw*.3),0,Math.PI*2);ctx.fill();if(s.r>1.15){ctx.fillStyle=`rgba(205,190,255,${tw*.17})`;ctx.fillRect(s.x-3,s.y-.35,6,.7);ctx.fillRect(s.x-.35,s.y-3,.7,6)}}if(!reduce&&now-lastAuto>nextAuto){burst(rand(w*.2,w*.8),rand(h*.2,h*.8));lastAuto=now;nextAuto=rand(7000,13000)}bursts=bursts.filter(b=>b.t<b.d);for(const b of bursts){b.t+=16;const p=Math.min(1,b.t/b.d),ease=1-Math.pow(1-p,3),fade=Math.sin(Math.PI*p),radius=b.r*(.2+ease*1.45);glow(b.x,b.y,radius*2.3,b.hue,.33*fade);ctx.beginPath();ctx.strokeStyle=`hsla(${b.hue},100%,83%,${.34*fade})`;ctx.lineWidth=1;ctx.arc(b.x,b.y,radius,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.fillStyle=`rgba(255,255,255,${.65*fade})`;ctx.arc(b.x,b.y,1.5+fade*2.2,0,Math.PI*2);ctx.fill();if(p<.22){const flare=(.22-p)/.22;glow(b.x,b.y,24+flare*25,b.hue,.48*flare)}}requestAnimationFrame(draw)}canvas.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,true));addEventListener('resize',resize);resize();requestAnimationFrame(draw);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
